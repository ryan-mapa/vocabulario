<!-- Vocabulario wordmark glyph: a V drawn as a chevron, with the acute accent
     Spanish uses to mark stress. The accent runs parallel to the V's right arm
     — it is the same stroke in miniature, which is what keeps it from reading
     as something stuck on afterwards. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vocabulario">
  <defs>
    <linearGradient id="vmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4572e"/>
      <stop offset="1" stop-color="#f2b134"/>
    </linearGradient>
  </defs>
  <path d="M14 26 L32 54 L50 26" fill="none" stroke="url(#vmark)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34.5 17 L41.5 6" stroke="#f2b134" stroke-width="7" stroke-linecap="round"/>
</svg>
