<!-- Vocabulario app icon: the V monogram as a badge.
     Solid field with the glyph knocked out, because strokes on a transparent
     ground turn to mush at 16px. The bare glyph lives in assets/logo.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vocabulario">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4572e"/>
      <stop offset="1" stop-color="#f2b134"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#badge)"/>
  <path d="M20 30 L32 49 L44 30" fill="none" stroke="#10131a" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 23 L39 14" stroke="#10131a" stroke-width="6.5" stroke-linecap="round"/>
</svg>
