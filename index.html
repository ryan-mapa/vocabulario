<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vocabulario — Spanish vocab game</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🇪🇸</text></svg>" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="wordmark">Vocabulario</h1>
      <div class="settings">
        <label class="field">
          <span>Deck</span>
          <select id="deck" translate="no"></select>
        </label>
        <label class="field">
          <span>Direction</span>
          <select id="direction" translate="no">
            <option value="es-en">Spanish → English</option>
            <option value="en-es">English → Spanish</option>
          </select>
        </label>
      </div>
    </header>

    <section class="scoreboard" aria-label="Score">
      <div class="stat"><span class="stat-value" id="score">0</span><span class="stat-label">points</span></div>
      <div class="stat"><span class="stat-value" id="streak">0</span><span class="stat-label">streak</span></div>
      <div class="stat"><span class="stat-value" id="mastery">0%</span><span class="stat-label">mastery</span></div>
      <div class="stat"><span class="stat-value" id="best">0</span><span class="stat-label">best</span></div>
    </section>

    <div class="progress" aria-hidden="true"><div class="progress-fill" id="round-progress"></div></div>

    <section class="stages" aria-label="Stage">
      <div class="stage-row" id="stage-row" role="group" aria-label="Choose a stage"></div>
      <p class="unlock-note" id="unlock-note"></p>
    </section>

    <section class="card" id="play">
      <p class="direction-hint" id="direction-hint">What does it mean…?</p>
      <p class="prompt" id="prompt" translate="no">—</p>
      <div class="choices" id="choices" translate="no"></div>
      <p class="feedback" id="feedback" role="status" aria-live="polite" translate="no">&nbsp;</p>
      <p class="variant-note" id="variant-note" translate="no" hidden></p>
    </section>

    <section class="card summary" id="summary" hidden>
      <p class="unlock-banner" id="unlock-banner" hidden></p>
      <h2>Round complete!</h2>
      <p class="summary-score"><span id="summary-score">0</span> points</p>
      <ul class="summary-list">
        <li><span id="summary-accuracy">0%</span> correct</li>
        <li>Best streak: <span id="summary-streak">0</span></li>
        <li><span id="summary-mastered">0</span> words mastered</li>
      </ul>
      <button class="primary" id="again" type="button">Play again</button>
    </section>

    <footer class="footer">
      <p class="hint">Answer with <kbd>1</kbd>–<kbd>4</kbd> · <kbd>Enter</kbd> to continue</p>
      <button class="ghost" id="reset" type="button">Clear progress</button>
    </footer>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
